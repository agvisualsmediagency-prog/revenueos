<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Revenue OS — AG Visuals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAFAFA; --card:#FFFFFF; --soft:#F5F5F5; --soft2:#FCFCFC;
  --ink:#0A0A0A; --ink2:#262626; --ink3:#525252; --muted:#737373; --faint:#A3A3A3;
  --line:#E5E5E5; --line2:#F0F0F0;

  /* money semantics */
  --hit:#16A34A;  --hit-bg:#F0FDF4;  --hit-line:#BBF7D0;
  --miss:#DC2626; --miss-bg:#FEF2F2; --miss-line:#FECACA;
  --part:#D97706; --part-bg:#FFFBEB; --part-line:#FDE68A;

  /* accent */
  --ember:#F26B1D; --ember2:#E25A0C; --ember-bg:#FFF4EC; --ember-line:#FED7AA;

  /* legacy names the views reference */
  --dim:#A3A3A3; --ash:#A3A3A3; --slab3:#E5E5E5;

  --r:16px; --r-sm:10px;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 24px rgba(0,0,0,.04);
  --shadow-lg:0 20px 60px rgba(0,0,0,.18);
  --font:'Poppins',system-ui,-apple-system,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
svg{width:18px;height:18px;flex-shrink:0}
.mono,.num,.gap-figure,.stat-v,.math-v,.rev-amt,.cell-amt,.step-mid,.big-in,.v{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--ember);outline-offset:2px}

/* ── top bar ── */
.top{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.88);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid var(--line)}
.top-in{max-width:1160px;margin:0 auto;height:72px;padding:0 24px;display:flex;align-items:center;gap:20px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-mark{position:relative;width:44px;height:44px;border-radius:10px;background:#000;color:#fff;display:grid;place-items:center;font-weight:700;font-size:16px;letter-spacing:-.04em;flex-shrink:0}
.brand-mark::after{content:'';position:absolute;right:7px;bottom:7px;width:6px;height:6px;border-radius:50%;background:var(--ember)}
.brand-name{font-size:16px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.brand-sub{font-size:12px;color:var(--muted);white-space:nowrap}
.nav{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:12px;margin:0 auto}
.nav-item{display:flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:9px;font-size:13px;font-weight:500;color:var(--muted);transition:background .15s,color .15s}
.nav-item svg{width:16px;height:16px}
.nav-item:hover{color:var(--ink)}
.nav-item.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.nav-item.on svg{color:var(--ember)}
.sync{display:flex;align-items:center;gap:8px;height:34px;padding:0 12px;border:1px solid var(--line);border-radius:999px;font-size:12px;font-weight:500;color:var(--ink3);background:#fff;white-space:nowrap}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--hit);box-shadow:0 0 0 3px var(--hit-bg)}
.sync.busy .sync-dot{background:var(--ember);box-shadow:0 0 0 3px var(--ember-bg);animation:pulse 1s infinite}
.sync.warn .sync-dot{background:var(--part);box-shadow:0 0 0 3px var(--part-bg)}
.sync.bad .sync-dot{background:var(--miss);box-shadow:0 0 0 3px var(--miss-bg)}
@keyframes pulse{50%{opacity:.35}}

/* ── page ── */
.main{max-width:1160px;margin:0 auto;padding:32px 24px 64px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.head-h{font-size:30px;font-weight:600;letter-spacing:-.025em;line-height:1.15}
.head-sub{font-size:14px;color:var(--muted);margin-top:4px}
.eyebrow{font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

.datenav,.cal-nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dbtn{width:40px;height:40px;border-radius:var(--r-sm);border:1px solid var(--line);background:#fff;display:grid;place-items:center;color:var(--ink3);transition:border-color .15s,color .15s}
.dbtn:hover{border-color:#D4D4D4;color:var(--ink)}
.dpill input{height:40px;border:1px solid var(--line);border-radius:var(--r-sm);background:#fff;padding:0 12px;font-size:14px;font-weight:500;color:var(--ink)}
.dpill input:focus{outline:none;border-color:var(--ember);box-shadow:0 0 0 3px var(--ember-bg)}
.today-btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:var(--r-sm);border:1px solid var(--line);background:#fff;font-size:13px;font-weight:500;color:var(--ink2);transition:border-color .15s}
.today-btn svg{width:16px;height:16px}
.today-btn:hover{border-color:#D4D4D4}
.today-btn.primary{background:#000;border-color:#000;color:#fff}
.today-btn.primary:hover{background:#262626}
.cal-month{min-width:150px;text-align:center;font-size:15px;font-weight:600}

/* ── cards ── */
.panel,.gap-card,.stat,.ed-eng,.insight{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}

/* hero */
.gap-card{padding:28px 30px 24px;margin-bottom:16px;position:relative;overflow:hidden}
.gap-card::before{content:'';position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,var(--ember),#FFA36B)}
.gap-card.done::before{background:var(--hit)}
.gap-top{display:flex;justify-content:space-between;gap:24px;align-items:flex-start}
.gap-figure{font-size:64px;font-weight:600;letter-spacing:-.04em;line-height:1.05;margin:6px 0 8px;color:var(--miss)}
.gap-card.done .gap-figure{color:var(--hit)}
.gap-cap{font-size:14px;color:var(--ink3);max-width:460px}
.gap-cap b{color:var(--ink);font-weight:600}
.target-set{text-align:right;flex-shrink:0}
.target-btn{display:inline-flex;align-items:center;gap:10px;height:48px;padding:0 16px;border-radius:12px;background:var(--ember-bg);border:1px solid var(--ember-line);color:var(--ember2);transition:transform .1s}
.target-btn .num{font-size:20px;font-weight:600;color:var(--ink)}
.target-btn:hover{border-color:var(--ember)}
.target-btn:active{transform:scale(.98)}
.bar{height:10px;border-radius:999px;background:var(--line2);margin-top:22px;overflow:hidden}
.bar-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--ember),#FF9A57);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.gap-card.done .bar-fill{background:var(--hit)}
.bar-legend{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:8px;font-variant-numeric:tabular-nums}
.math{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:20px;padding-top:20px;border-top:1px solid var(--line2)}
.math-v{font-size:22px;font-weight:600;letter-spacing:-.02em;margin-top:4px}
.math-v small{font-size:13px;font-weight:400;color:var(--muted);letter-spacing:0}

/* stat tiles */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat{padding:18px 20px}
.stat-v{font-size:28px;font-weight:600;letter-spacing:-.03em;margin:6px 0 2px;line-height:1.1}
.stat-note{font-size:12px;color:var(--muted)}

/* layout */
.grid2{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:16px;align-items:start}
.panel{overflow:hidden}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line2)}
.panel-title{font-size:15px;font-weight:600;letter-spacing:-.01em}
.panel-body{padding:8px 10px 12px}
.panel-body.tight{padding:16px 20px 20px}

/* mission */
.eng+.eng{border-top:1px solid var(--line2);margin-top:4px}
.eng-head{display:flex;align-items:center;gap:10px;padding:14px 12px 6px}
.eng-tick{width:4px;height:16px;border-radius:2px;flex-shrink:0}
.eng-name{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink)}
.eng-win{font-size:12px;color:var(--faint)}
.eng-count{margin-left:auto;font-size:12px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.eng-mini{width:52px;height:5px;border-radius:999px;background:var(--line2);overflow:hidden}
.eng-mini i{display:block;height:100%;border-radius:999px;transition:width .3s}
.task{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;transition:background .12s}
.task:hover{background:var(--soft)}
.tick{width:22px;height:22px;border-radius:7px;border:1.5px solid #D4D4D4;background:#fff;flex-shrink:0;position:relative;transition:background .15s,border-color .15s}
.tick:hover{border-color:var(--ink3)}
.tick.on{background:#000;border-color:#000}
.tick.on::after{content:'';position:absolute;left:7px;top:3px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.task-label{flex:1;min-width:0;font-size:13.5px;font-weight:500;color:var(--ink2);cursor:pointer;line-height:1.4}
.task.done .task-label{color:var(--faint);text-decoration:line-through;text-decoration-color:#D4D4D4}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:#fff;flex-shrink:0}
.step button{width:32px;height:32px;font-size:16px;color:var(--ink3)}
.step button:hover{color:var(--ink)}
.step-mid{min-width:66px;text-align:center;font-size:13px;font-weight:600;cursor:pointer}
.step-mid span{font-weight:400;color:var(--muted);font-size:11px}
.step-mid.full{color:var(--hit)}

/* money in */
.rev-item{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line2)}
.rev-amt{font-size:18px;font-weight:600;color:var(--hit);min-width:78px;letter-spacing:-.02em}
.rev-amt.booked{color:var(--part)}
.rev-who{flex:1;min-width:0;display:flex;flex-direction:column}
.rev-who b{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rev-who span{font-size:12px;color:var(--muted)}
.x{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--faint)}
.x:hover{background:var(--miss-bg);color:var(--miss)}
.x svg{width:16px;height:16px}
.add-rev{width:100%;height:48px;margin-top:14px;border-radius:12px;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:600;transition:background .15s,transform .1s}
.add-rev:hover{background:#262626}
.add-rev:active{transform:scale(.99)}
.add-rev svg{width:16px;height:16px}
.note-box{width:100%;min-height:120px;resize:vertical;border:1px solid var(--line);border-radius:12px;background:var(--soft2);padding:14px;font-size:14px;line-height:1.55}
.note-box:focus{outline:none;border-color:var(--ember);box-shadow:0 0 0 3px var(--ember-bg);background:#fff}
.note-box::placeholder{color:var(--faint)}

.empty{text-align:center;padding:26px 16px;font-size:13px;color:var(--muted)}
.empty b{display:block;font-size:14px;font-weight:600;color:var(--ink);margin-bottom:2px}

/* insights */
.insight{padding:18px 20px;margin-bottom:14px;border-left:3px solid var(--ember)}
.insight.good{border-left-color:var(--hit)}
.insight.warn{border-left-color:var(--miss)}
.insight p{font-size:14px;color:var(--ink3);margin-top:6px;line-height:1.6}
.insight b{color:var(--ink);font-weight:600}

/* engine editor */
.ed-eng{margin-bottom:16px;overflow:hidden}
.ed-eng-head{display:flex;align-items:center;gap:10px;padding:14px 16px;background:var(--soft2);border-bottom:1px solid var(--line2)}
.swatch{width:28px;height:28px;border:1px solid var(--line);border-radius:8px;padding:2px;background:#fff;cursor:pointer;flex-shrink:0}
.swatch::-webkit-color-swatch-wrapper{padding:0}
.swatch::-webkit-color-swatch{border:0;border-radius:5px}
.ename{flex:1;min-width:0;height:38px;border:1px solid transparent;border-radius:8px;background:transparent;padding:0 8px;font-size:15px;font-weight:600}
.ewin{width:170px;height:38px;border:1px solid transparent;border-radius:8px;background:transparent;padding:0 8px;font-size:13px;color:var(--muted)}
.ename:hover,.ewin:hover{border-color:var(--line)}
.ename:focus,.ewin:focus,.fld:focus{outline:none;border-color:var(--ember);box-shadow:0 0 0 3px var(--ember-bg);background:#fff}
.rowacts{display:flex;gap:2px;flex-shrink:0}
.iact{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--faint);transition:background .12s,color .12s}
.iact svg{width:16px;height:16px}
.iact:hover{background:var(--soft);color:var(--ink)}
.iact.del:hover{background:var(--miss-bg);color:var(--miss)}
.ed-task{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line2)}
.ed-task.off{opacity:.45}
.fld{width:100%;height:40px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:0 12px;font-size:14px}
.fld::placeholder{color:var(--faint)}
.qty-wrap{display:flex;gap:6px}
.fld.qty{width:64px;text-align:center;font-variant-numeric:tabular-nums}
.fld.unit{width:84px}
.daybar{display:flex;gap:4px}
.daybit{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:11px;font-weight:600;color:var(--faint)}
.daybit.on{background:var(--ember-bg);border-color:var(--ember-line);color:var(--ember2)}
.addrow{display:flex;align-items:center;gap:8px;width:100%;padding:13px 18px;font-size:13px;font-weight:500;color:var(--muted);transition:background .12s,color .12s}
.addrow svg{width:16px;height:16px}
.addrow:hover{background:var(--soft2);color:var(--ember2)}

/* calendar */
.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:8px}
.dow div{text-align:center;font-size:11px;font-weight:500;letter-spacing:.06em;color:var(--faint)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cell{min-height:86px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:8px 9px;text-align:left;display:flex;flex-direction:column;gap:1px;transition:border-color .12s,transform .1s}
.cell:hover{border-color:#C7C7C7}
.cell:active{transform:scale(.98)}
.cell.blank{visibility:hidden}
.cell-d{font-size:12px;font-weight:600;color:var(--ink3)}
.cell-tasks{font-size:10px;color:var(--muted)}
.cell-amt{margin-top:auto;font-size:13px;font-weight:600;letter-spacing:-.01em}
.cell-tgt{font-size:10px;color:var(--muted)}
.cell.hit{background:var(--hit-bg);border-color:var(--hit-line)}
.cell.hit .cell-amt{color:var(--hit)}
.cell.part{background:var(--part-bg);border-color:var(--part-line)}
.cell.part .cell-amt{color:var(--part)}
.cell.low{background:var(--ember-bg);border-color:var(--ember-line)}
.cell.low .cell-amt{color:var(--ember2)}
.cell.zero{background:var(--miss-bg);border-color:var(--miss-line)}
.cell.zero .cell-amt{color:var(--miss)}
.cell.today .cell-d{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--ember);color:#fff;margin:-2px 0 0 -3px}
.cell.sel{box-shadow:0 0 0 2px var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line2)}
.lg{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.lg i{width:10px;height:10px;border-radius:3px;display:block}

/* chart */
.chart{display:flex;align-items:stretch;gap:6px;height:210px}
.col{flex:1;display:flex;flex-direction:column;min-width:0}
.col-stack{flex:1;position:relative;display:flex;align-items:flex-end;border-bottom:1px solid var(--line)}
.col-bar{width:100%;border-radius:6px 6px 0 0;background:var(--ember);min-height:0;transition:height .4s}
.col-bar.hit{background:var(--hit)}
.col-goal{position:absolute;left:0;right:0;border-top:2px dashed #BDBDBD}
.col-x{text-align:center;font-size:11px;color:var(--faint);margin-top:6px;font-variant-numeric:tabular-nums}

/* mini lists */
.mini-list{display:flex;flex-direction:column}
.mini-row{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line2)}
.mini-row:last-child{border-bottom:0}
.mini-row .k{flex:1;min-width:0;font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-track{width:38%;height:6px;border-radius:999px;background:var(--line2);overflow:hidden;flex-shrink:0}
.mini-track i{display:block;height:100%;border-radius:999px;background:var(--ember)}
.mini-row .v{font-size:13px;font-weight:600}

/* modal */
.scrim{position:fixed;inset:0;z-index:100;background:rgba(10,10,10,.42);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .15s}
.modal{width:min(440px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:20px;padding:26px;box-shadow:var(--shadow-lg);animation:pop .2s cubic-bezier(.2,.9,.3,1.2)}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}}
.modal h3{font-size:20px;font-weight:600;letter-spacing:-.02em;line-height:1.25}
.modal .sub{font-size:13px;color:var(--muted);margin:4px 0 18px}
.big-in{width:100%;height:68px;border:1px solid var(--line);border-radius:14px;background:var(--soft2);text-align:center;font-size:34px;font-weight:600;letter-spacing:-.03em}
.big-in:focus{outline:none;border-color:var(--ember);box-shadow:0 0 0 3px var(--ember-bg);background:#fff}
.field{margin-bottom:14px}
.field .eyebrow{display:block;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:500;color:var(--ink3);transition:all .12s}
.chip:hover{border-color:#C7C7C7;color:var(--ink)}
.chip.on{background:var(--ember-bg);border-color:var(--ember);color:var(--ember2)}
.modal-acts{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;margin-top:22px}
.btn{height:48px;border-radius:12px;font-size:14px;font-weight:600;transition:background .15s}
.btn.ghost{border:1px solid var(--line);background:#fff;color:var(--ink2)}
.btn.ghost:hover{background:var(--soft)}
.btn.go{background:#000;color:#fff}
.btn.go:hover{background:#262626}

/* toast */
#toastRoot{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:120;pointer-events:none}
.toast{background:#0A0A0A;color:#fff;font-size:13px;font-weight:500;padding:12px 18px;border-radius:999px;box-shadow:var(--shadow-lg);animation:pop .2s;white-space:nowrap}
.toast.win{background:var(--hit)}

/* mobile tab bar */
.tabbar{display:none}

@media (max-width:900px){
  .nav{display:none}
  .top-in{height:64px;padding:0 16px}
  .brand-mark{width:40px;height:40px}
  .sync{margin-left:auto}
  .main{padding:22px 16px calc(100px + env(safe-area-inset-bottom))}
  .grid2{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 5px;font-size:11px;font-weight:500;color:var(--faint);border-radius:10px;position:relative}
  .tab svg{width:21px;height:21px}
  .tab.on{color:var(--ink)}
  .tab.on svg{color:var(--ember)}
  #toastRoot{bottom:calc(92px + env(safe-area-inset-bottom))}

<script>
/* ═══════════════════════════════════════════════════
   AG VISUALS — REVENUE OS
   ═══════════════════════════════════════════════════ */

const SUPA_URL = 'https://xpuftglvklaqskztvlae.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhwdWZ0Z2x2a2xhcXNrenR2bGFlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwNDg1NTgsImV4cCI6MjEwMTYyNDU1OH0.1MYQLO1dZsfQIc1AgVd917vOD6MLUPLwUGYeqm8PJ-I';

const HEADERS = {
  apikey: SUPA_KEY,
  Authorization: 'Bearer ' + SUPA_KEY,
  'Content-Type': 'application/json'
};

/* ── dates (local time, never UTC) ── */
const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const parseISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseISO(s); d.setDate(d.getDate() + n); return iso(d); };
const TODAY = () => iso(new Date());
const DOW_FULL = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const DOW_S = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
const MON = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const money = n => '$' + Math.round(n).toLocaleString('en-US');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ── state ── */
const S = {
  view: 'war',
  date: TODAY(),
  calMonth: (() => { const d = new Date(); d.setDate(1); return iso(d); })(),
  engines: [], tasks: [],
  cfg: { monthly_target: 12000, default_daily: 400, avg_deal: 650, close_rate: 12 },
  days: {}, logs: {}, rev: {},
  loadedMonths: new Set(),
  queue: [], live: false, booting: true
};

/* ═══ PERSISTENCE ═══ */
const CACHE = 'ros_cache_v1', QKEY = 'ros_queue_v1';

function saveCache() {
  try {
    localStorage.setItem(CACHE, JSON.stringify({
      engines: S.engines, tasks: S.tasks, cfg: S.cfg,
      days: S.days, logs: S.logs, rev: S.rev
    }));
  } catch (e) { /* quota — non-fatal */ }
}
function loadCache() {
  try {
    const c = JSON.parse(localStorage.getItem(CACHE) || 'null');
    if (!c) return false;
    Object.assign(S, {
      engines: c.engines || [], tasks: c.tasks || [],
      cfg: { ...S.cfg, ...(c.cfg || {}) },
      days: c.days || {}, logs: c.logs || {}, rev: c.rev || {}
    });
    return S.tasks.length > 0;
  } catch (e) { return false; }
}
function saveQueue() { try { localStorage.setItem(QKEY, JSON.stringify(S.queue)); } catch (e) {} }
function loadQueue() { try { S.queue = JSON.parse(localStorage.getItem(QKEY) || '[]'); } catch (e) { S.queue = []; } }

/* ═══ NETWORK ═══ */
async function api(path, opts = {}) {
  const r = await fetch(SUPA_URL + '/rest/v1/' + path, {
    ...opts,
    headers: { ...HEADERS, ...(opts.headers || {}) }
  });
  if (!r.ok) throw new Error(r.status + ' ' + (await r.text()).slice(0, 200));
  const t = await r.text();
  return t ? JSON.parse(t) : [];
}

/* fire-and-forget write; on failure it goes in the queue */
function write(path, opts, tag) {
  const job = { path, opts, tag, at: Date.now() };
  setSync('busy', 'Saving');
  api(path, opts)
    .then(() => { S.live = true; flush(); })
    .catch(() => { S.queue.push(job); saveQueue(); setSync('warn', S.queue.length + ' pending'); });
}

async function flush() {
  if (!S.queue.length) { setSync('ok', S.live ? 'Synced' : 'Local only'); return; }
  setSync('busy', 'Syncing ' + S.queue.length);
  const pending = [...S.queue];
  S.queue = [];
  for (const job of pending) {
    try { await api(job.path, job.opts); }
    catch (e) { S.queue.push(job); }
  }
  saveQueue();
  setSync(S.queue.length ? 'warn' : 'ok', S.queue.length ? S.queue.length + ' pending' : 'Synced');
}

function setSync(kind, txt) {
  const el = document.getElementById('sync');
  if (!el) return;
  el.className = 'sync' + (kind === 'ok' ? '' : ' ' + kind);
  document.getElementById('syncTxt').textContent = txt;
}

/* shorthands */
const _pend = {};
function upsertDeb(key, table, rows, onConflict, ms = 450) {
  clearTimeout(_pend[key]);
  _pend[key] = setTimeout(() => { delete _pend[key]; upsert(table, rows, onConflict); }, ms);
}
const upsert = (table, rows, onConflict) => write(
  table + (onConflict ? '?on_conflict=' + onConflict : ''),
  { method: 'POST', body: JSON.stringify(rows), headers: { Prefer: 'resolution=merge-duplicates,return=minimal' } },
  table
);
const patch = (table, filter, body) => write(table + '?' + filter, { method: 'PATCH', body: JSON.stringify(body), headers: { Prefer: 'return=minimal' } }, table);
const remove = (table, filter) => write(table + '?' + filter, { method: 'DELETE', headers: { Prefer: 'return=minimal' } }, table);

/* ═══ LOAD ═══ */
async function boot() {
  loadQueue();
  const hadCache = loadCache();
  if (hadCache) { S.booting = false; render(); }

  try {
    const since = addDays(TODAY(), -180);
    const [engines, tasks, days, revenue, logs, settings] = await Promise.all([
      api('ros_engine?select=*&order=sort.asc'),
      api('ros_task?select=*&order=sort.asc'),
      api('ros_day?select=*&limit=3000'),
      api('ros_revenue?select=*&order=created_at.asc&limit=5000'),
      api('ros_log?select=*&day=gte.' + since + '&limit=20000'),
      api('ros_setting?select=*&key=eq.config')
    ]);

    S.engines = engines;
    S.tasks = tasks;
    S.days = {}; days.forEach(d => S.days[d.day] = d);
    S.rev = {}; revenue.forEach(r => (S.rev[r.day] ||= []).push(r));
    S.logs = {}; logs.forEach(l => ((S.logs[l.day] ||= {})[l.task_id] = l));
    if (settings[0]?.value) S.cfg = { ...S.cfg, ...settings[0].value };

    S.live = true;
    S.booting = false;
    saveCache();
    await flush();
    render();
  } catch (e) {
    S.booting = false;
    console.warn('Supabase unreachable:', e.message);
    setSync('bad', hadCache ? 'Offline · cached' : 'No connection');
    if (!hadCache) {
      document.getElementById('main').innerHTML = `
        <div class="panel"><div class="panel-body tight">
          <div class="empty">
            <b>Can't reach Supabase</b>
            Run <span class="mono">supabase-setup.sql</span> in your project's SQL editor,
            then reload. Your work is saved locally in the meantime.
          </div>
        </div></div>`;
    } else render();
  }
}

/* ═══ DERIVED ═══ */
const dayTarget = d => S.days[d]?.target_amount != null ? +S.days[d].target_amount : +S.cfg.default_daily;
const targetIsSet = d => S.days[d]?.target_amount != null;
const dayRev = d => (S.rev[d] || []).filter(r => r.status !== 'booked').reduce((a, r) => a + (+r.amount), 0);
const dayBooked = d => (S.rev[d] || []).filter(r => r.status === 'booked').reduce((a, r) => a + (+r.amount), 0);
/* a day counts as worked only if something was actually done or logged — an unchecked task no longer counts */
const hasActivity = d => !!S.days[d] || (S.rev[d] || []).length > 0
  || Object.values(S.logs[d] || {}).some(l => l.done || (l.qty_done || 0) > 0);

function tasksFor(dateStr) {
  const dow = parseISO(dateStr).getDay();
  return S.tasks
    .filter(t => t.active !== false && (t.days || []).includes(dow))
    .sort((a, b) => (a.sort || 0) - (b.sort || 0));
}
const logOf = (d, id) => (S.logs[d] || {})[id] || { qty_done: 0, done: false, target_override: null };
const tgtOf = (d, t) => { const o = logOf(d, t.id).target_override; return o != null ? o : (t.target_qty || 0); };
function taskDone(d, t) {
  const l = logOf(d, t.id), tg = tgtOf(d, t);
  return tg > 0 ? (l.qty_done || 0) >= tg : !!l.done;
}
function dayCompletion(d) {
  const ts = tasksFor(d);
  if (!ts.length) return { done: 0, total: 0, pct: 0 };
  const done = ts.filter(t => taskDone(d, t)).length;
  return { done, total: ts.length, pct: done / ts.length };
}

function statusOf(d) {
  if (!hasActivity(d)) return '';
  const t = dayTarget(d), r = dayRev(d);
  if (t <= 0) return r > 0 ? 'hit' : '';
  if (r >= t) return 'hit';
  if (r >= t * 0.5) return 'part';
  if (r > 0) return 'low';
  return 'zero';
}

function streak() {
  let n = 0, d = TODAY();
  if (statusOf(d) !== 'hit') d = addDays(d, -1);
  while (statusOf(d) === 'hit') { n++; d = addDays(d, -1); }
  return n;
}

function monthStats(ym) {
  const [y, m] = ym.split('-').map(Number);
  let rev = 0, booked = 0, tgt = 0, hits = 0, logged = 0, deals = 0;
  const last = new Date(y, m, 0).getDate();
  for (let i = 1; i <= last; i++) {
    const d = `${y}-${String(m).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
    rev += dayRev(d); booked += dayBooked(d);
    deals += (S.rev[d] || []).filter(r => r.status !== 'booked').length;
    if (hasActivity(d)) { logged++; tgt += dayTarget(d); if (statusOf(d) === 'hit') hits++; }
  }
  return { rev, booked, tgt, hits, logged, deals, last };
}

/* ═══ MUTATIONS ═══ */
function setDay(d, fields) {
  S.days[d] = { day: d, target_amount: dayTarget(d), note: '', ...(S.days[d] || {}), ...fields };
  saveCache();
  upsertDeb('day:' + d, 'ros_day', [{ day: d, target_amount: S.days[d].target_amount, note: S.days[d].note || '', updated_at: new Date().toISOString() }], 'day');
}

function setLog(d, taskId, fields) {
  const cur = { day: d, task_id: taskId, qty_done: 0, done: false, target_override: null, ...logOf(d, taskId), ...fields };
  (S.logs[d] ||= {})[taskId] = cur;
  saveCache();
  upsertDeb('log:' + d + ':' + taskId, 'ros_log', [{ day: d, task_id: taskId, qty_done: cur.qty_done, done: cur.done, target_override: cur.target_override, updated_at: new Date().toISOString() }], 'day,task_id');
}

function saveCfg() {
  saveCache();
  upsert('ros_setting', [{ key: 'config', value: S.cfg }], 'key');
}

function saveTask(t) {
  saveCache();
  upsert('ros_task', [{ id: t.id, engine_id: t.engine_id, label: t.label, target_qty: t.target_qty, unit: t.unit, days: t.days, sort: t.sort, active: t.active }], 'id');
}

function saveEngine(e) {
  saveCache();
  upsert('ros_engine', [{ id: e.id, name: e.name, window_label: e.window_label, color: e.color, sort: e.sort, active: e.active }], 'id');
}

const uid = () => (crypto.randomUUID ? crypto.randomUUID()
  : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
      const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16);
    }));

/* ═══ UI HELPERS ═══ */
function toast(msg, win) {
  const r = document.getElementById('toastRoot');
  r.innerHTML = `<div class="toast${win ? ' win' : ''}">${esc(msg)}</div>`;
  clearTimeout(toast._t);
  toast._t = setTimeout(() => r.innerHTML = '', 2600);
}
function closeModal() { document.getElementById('modalRoot').innerHTML = ''; }
function openModal(html) {
  const r = document.getElementById('modalRoot');
  r.innerHTML = `<div class="scrim" data-scrim>${html}</div>`;
  r.querySelector('[data-scrim]').addEventListener('mousedown', e => { if (e.target.hasAttribute('data-scrim')) closeModal(); });
  const f = r.querySelector('input,textarea'); if (f) setTimeout(() => { f.focus(); f.select?.(); }, 40);
}
const ICON = {
  left: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
  right: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>',
  pen: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>',

  down: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
  eye: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>',
  eyeoff: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.9 17.9A10.3 10.3 0 0112 19C6 19 2 12 2 12a18 18 0 015.1-5.9M9.9 4.2A10 10 0 0112 4c6 0 10 8 10 8a18 18 0 01-2.2 3.2M1 1l22 22"/></svg>',
  gear: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.9l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-2.9 1.2V21a2 2 0 11-4 0v-.1A1.7 1.7 0 007 19.4l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00-1.2-2.9H3a2 2 0 110-4h.1A1.7 1.7 0 004.6 7l-.1-.1a2 2 0 112.8-2.8l.1.1A1.7 1.7 0 0010 4.6V3a2 2 0 114 0v.1A1.7 1.7 0 0017 4.6l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 001.2 2.9H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>'
};

/* ═══════════════ VIEW: WAR ROOM ═══════════════ */
function viewWar() {
  const d = S.date, isToday = d === TODAY();
  const tgt = dayTarget(d), got = dayRev(d), bkd = dayBooked(d);
  const gap = Math.max(0, tgt - got), pct = tgt > 0 ? Math.min(1, got / tgt) : (got > 0 ? 1 : 0);
  const hit = tgt > 0 && got >= tgt;
  const dt = parseISO(d);
  const comp = dayCompletion(d);
  const ms = monthStats(d.slice(0, 7));
  const dayWord = isToday ? 'today' : 'this day';

  const deals = S.cfg.avg_deal > 0 ? Math.ceil(gap / S.cfg.avg_deal) : 0;
  const convos = S.cfg.close_rate > 0 ? Math.ceil(deals / (S.cfg.close_rate / 100)) : 0;

  /* mission grouped by engine */
  const ts = tasksFor(d);
  let mission = '';
  if (!ts.length) {
    mission = `<div class="empty"><b>Nothing scheduled</b>No tasks are assigned to ${DOW_FULL[dt.getDay()]}. Open Sales engine to add some.</div>`;
  } else {
    const order = S.engines.slice().sort((a, b) => (a.sort || 0) - (b.sort || 0));
    mission = order.map(e => {
      const et = ts.filter(t => t.engine_id === e.id);
      if (!et.length) return '';
      const dn = et.filter(t => taskDone(d, t)).length;
      const p = Math.round(dn / et.length * 100);
      return `
      <div class="eng">
        <div class="eng-head">
          <span class="eng-tick" style="background:${esc(e.color || '#F26B1D')}"></span>
          <span class="eng-name">${esc(e.name)}</span>
          <span class="eng-win">${esc(e.window_label || '')}</span>
          <span class="eng-count">${dn}/${et.length}</span>
          <span class="eng-mini"><i style="width:${p}%;background:${esc(e.color || '#F26B1D')}"></i></span>
        </div>
        ${et.map(t => taskRow(d, t)).join('')}
      </div>`;
    }).join('');
    const orphan = ts.filter(t => !S.engines.some(e => e.id === t.engine_id));
    if (orphan.length) mission += `<div class="eng"><div class="eng-head"><span class="eng-tick" style="background:var(--ash)"></span><span class="eng-name">Unfiled</span></div>${orphan.map(t => taskRow(d, t)).join('')}</div>`;
  }

  /* revenue entries */
  const entries = (S.rev[d] || []);
  const paidCount = entries.filter(r => r.status !== 'booked').length;
  const revList = entries.length
    ? entries.map(r => `
      <div class="rev-item">
        <div class="rev-amt ${r.status === 'booked' ? 'booked' : ''}">${money(+r.amount)}</div>
        <div class="rev-who">
          <b>${esc(r.client || 'Unnamed')}</b>
          <span>${esc(r.service || '—')}${r.status === 'booked' ? ' · booked, not paid' : ''}</span>
        </div>
        <button class="x" data-act="del-rev" data-id="${r.id}" aria-label="Delete entry">${ICON.x}</button>
      </div>`).join('')
    : `<div class="empty"><b>No money yet</b>Log the first dollar of the day.</div>`;

  return `
  <div class="head">
    <div>
      <div class="head-h">${isToday ? 'Today' : DOW_FULL[dt.getDay()]}</div>
      <div class="head-sub">${DOW_FULL[dt.getDay()]}, ${MON[dt.getMonth()]} ${dt.getDate()}, ${dt.getFullYear()}</div>

    <div class="datenav">

      <button class="dbtn" data-act="nav-day" data-delta="1" aria-label="Next day">${ICON.right}</button>
      ${isToday ? '' : '<button class="today-btn primary" data-act="today">Back to today</button>'}
    </div>
  </div>

  <div class="gap-card ${hit ? 'done' : ''}">
    <div class="gap-top">
      <div>
        <div class="eyebrow">${hit ? 'Target cleared' : (isToday ? 'Still need today' : 'Still needed')}</div>
        <div class="gap-figure">${hit ? money(got) : money(gap)}</div>
        <div class="gap-cap">
          ${hit
            ? `You set <b>${money(tgt)}</b> and brought in <b>${money(got)}</b>. Anything past this is surplus.`
            : `You set <b>${money(tgt)}</b>. <b>${money(got)}</b> is in. This is what ${dayWord} still owes you.`}

      </div>
      <div class="target-set">
        <div class="eyebrow" style="margin-bottom:8px">${isToday ? "Today's target" : 'Target'}</div>
        <button class="target-btn" data-act="set-target" aria-label="Change target">
          <span class="num">${money(tgt)}</span>${ICON.pen}
        </button>
        ${targetIsSet(d) ? '' : '<div class="eyebrow" style="margin-top:8px;color:var(--faint);text-transform:none;letter-spacing:0">Using your default</div>'}
      </div>
    </div>

    <div class="bar"><div class="bar-fill" style="width:${(pct * 100).toFixed(1)}%"></div></div>
    <div class="bar-legend"><span>${money(got)} collected</span><span>${Math.round(pct * 100)}%</span><span>${money(tgt)}</span></div>

    ${hit ? '' : `
    <div class="math">
      <div class="math-b">
        <div class="eyebrow">Closes needed</div>
        <div class="math-v">${deals} <small>at ${money(S.cfg.avg_deal)} avg</small></div>
      </div>
      <div class="math-b">
        <div class="eyebrow">Real conversations</div>
        <div class="math-v">${convos} <small>at ${S.cfg.close_rate}% close</small></div>
      </div>
      <div class="math-b">
        <div class="eyebrow">Mission</div>
        <div class="math-v">${comp.done}/${comp.total} <small>tasks done</small></div>
      </div>
    </div>`}
  </div>

  <div class="stats">
    <div class="stat">
      <div class="eyebrow">${isToday ? 'Collected today' : 'Collected'}</div>
      <div class="stat-v" style="color:var(--hit)">${money(got)}</div>
      <div class="stat-note">${paidCount} entr${paidCount === 1 ? 'y' : 'ies'}</div>
    </div>
    <div class="stat">
      <div class="eyebrow">Booked, not paid</div>
      <div class="stat-v" style="color:var(--part)">${money(bkd)}</div>
      <div class="stat-note">shoot scheduled</div>
    </div>
    <div class="stat">
      <div class="eyebrow">${MON[dt.getMonth()].slice(0, 3)} to date</div>
      <div class="stat-v">${money(ms.rev)}</div>
      <div class="stat-note">${ms.deals} deal${ms.deals === 1 ? '' : 's'} · ${Math.round(ms.rev / Math.max(1, S.cfg.monthly_target) * 100)}% of ${money(S.cfg.monthly_target)}</div>
    </div>
    <div class="stat">
      <div class="eyebrow">Streak</div>
      <div class="stat-v" style="color:${streak() > 0 ? 'var(--ember)' : 'var(--dim)'}">${streak()}</div>
      <div class="stat-note">day${streak() === 1 ? '' : 's'} hitting target</div>
    </div>
  </div>

  <div class="grid2">
    <div class="panel">
      <div class="panel-head">
        <div class="panel-title">${isToday ? "Today's mission" : 'Mission'}</div>
        <div class="eyebrow">${comp.done}/${comp.total} · ${Math.round(comp.pct * 100)}%</div>
      </div>
      <div class="panel-body">${mission}</div>

    <div>
      <div class="panel" style="margin-bottom:16px">
        <div class="panel-head"><div class="panel-title">Money in</div><div class="eyebrow">${MON[dt.getMonth()].slice(0, 3)} ${dt.getDate()}</div></div>
        <div class="panel-body tight">

        <div class="panel-body tight">
          <textarea class="note-box" data-fld="note" placeholder="What actually happened? Objections, who went cold, what to try tomorrow.">${esc(S.days[d]?.note || '')}</textarea>
        </div>
      </div>
    </div>
  </div>`;
}

function taskRow(d, t) {
  const l = logOf(d, t.id), tg = tgtOf(d, t), done = taskDone(d, t);
  const overridden = l.target_override != null && l.target_override !== t.target_qty;
  if (tg > 0) {
    return `
    <div class="task ${done ? 'done' : ''}">
      <button class="tick ${done ? 'on' : ''}" data-act="qty-max" data-id="${t.id}" aria-label="Mark complete"></button>
      <div class="task-label" data-act="qty-edit" data-id="${t.id}">${esc(t.label)}${overridden ? ' <span style="font-size:11px;font-weight:500;color:var(--ember2)">· today only</span>' : ''}</div>
      <div class="step">
        <button data-act="qty" data-id="${t.id}" data-delta="-1" aria-label="Decrease">−</button>
        <div class="step-mid ${done ? 'full' : ''}" data-act="qty-edit" data-id="${t.id}" title="Tap to type the real number, or change today's target">${l.qty_done || 0}<span>/${tg} ${esc(t.unit || '')}</span></div>
        <button data-act="qty" data-id="${t.id}" data-delta="1" aria-label="Increase">+</button>
      </div>
    </div>`;
  }
  return `
  <div class="task ${done ? 'done' : ''}">
    <button class="tick ${done ? 'on' : ''}" data-act="toggle" data-id="${t.id}" aria-label="Toggle"></button>
    <div class="task-label" data-act="toggle" data-id="${t.id}">${esc(t.label)}</div>
  </div>`;
}

/* ═══════════════ VIEW: CALENDAR ═══════════════ */
function viewCal() {
  const [y, m] = S.calMonth.split('-').map(Number);
  const first = new Date(y, m - 1, 1);
  const lead = first.getDay(), last = new Date(y, m, 0).getDate();
  const ms = monthStats(S.calMonth);

  let cells = '';
  for (let i = 0; i < lead; i++) cells += '<div class="cell blank"></div>';
  for (let i = 1; i <= last; i++) {
    const ds = `${y}-${String(m).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
    const st = statusOf(ds), r = dayRev(ds), c = dayCompletion(ds);
    cells += `
    <button class="cell ${st} ${ds === TODAY() ? 'today' : ''} ${ds === S.date ? 'sel' : ''}" data-act="cal-day" data-date="${ds}">
      <div class="cell-d">${i}</div>
      ${c.total && hasActivity(ds) ? `<div class="cell-tasks">${c.done}/${c.total} tasks</div>` : ''}
      <div class="cell-amt">${st ? (r > 0 ? money(r) : '$0') : ''}</div>
      ${hasActivity(ds) && dayTarget(ds) > 0 ? `<div class="cell-tgt">of ${money(dayTarget(ds))}</div>` : ''}
    </button>`;
  }

  return `
  <div class="head">
    <div>
      <div class="head-h">Calendar</div>
      <div class="head-sub">Green means you hit the number you set. Tap any day to open it.</div>
    </div>
    <div class="cal-nav">
      <button class="dbtn" data-act="cal-prev" aria-label="Previous month">${ICON.left}</button>
      <div class="cal-month">${MON[m - 1]} ${y}</div>
      <button class="dbtn" data-act="cal-next" aria-label="Next month">${ICON.right}</button>
    </div>
  </div>

  <div class="stats">
    <div class="stat"><div class="eyebrow">Collected</div><div class="stat-v" style="color:var(--hit)">${money(ms.rev)}</div><div class="stat-note">${ms.deals} deal${ms.deals === 1 ? '' : 's'}</div></div>
    <div class="stat"><div class="eyebrow">Targeted</div><div class="stat-v">${money(ms.tgt)}</div><div class="stat-note">across ${ms.logged} active day${ms.logged === 1 ? '' : 's'}</div></div>
    <div class="stat"><div class="eyebrow">Days hit</div><div class="stat-v" style="color:${ms.hits ? 'var(--hit)' : 'var(--miss)'}">${ms.hits}</div><div class="stat-note">of ${ms.logged} worked</div></div>
    <div class="stat"><div class="eyebrow">Avg per active day</div><div class="stat-v">${money(ms.logged ? ms.rev / ms.logged : 0)}</div><div class="stat-note">collected</div></div>
  </div>

  <div class="panel">
    <div class="panel-body tight">
      <div class="dow">${['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(x => `<div>${x}</div>`).join('')}</div>
      <div class="cal-grid">${cells}</div>
      <div class="legend">
        <span class="lg"><i style="background:var(--hit)"></i>Hit target</span>
        <span class="lg"><i style="background:var(--part)"></i>Half or better</span>
        <span class="lg"><i style="background:var(--ember)"></i>Something came in</span>
        <span class="lg"><i style="background:var(--miss)"></i>Worked, no money</span>
        <span class="lg"><i style="background:var(--slab3)"></i>Untouched</span>
      </div>
    </div>
  </div>`;
}

/* ═══════════════ VIEW: ANALYTICS ═══════════════ */
function viewAn() {
  const today = TODAY(), ym = today.slice(0, 7);
  const ms = monthStats(ym);
  const dnum = new Date().getDate();
  const remaining = Math.max(1, ms.last - dnum + 1);
  const need = Math.max(0, S.cfg.monthly_target - ms.rev);
  const perDay = need / remaining;

  /* last 14 days chart */
  const bars = [];
  for (let i = 13; i >= 0; i--) {
    const ds = addDays(today, -i);
    bars.push({ ds, rev: dayRev(ds), tgt: dayTarget(ds), on: hasActivity(ds) });
  }
  const peak = Math.max(...bars.map(b => Math.max(b.rev, b.on ? b.tgt : 0)), 100);
  const chart = bars.map(b => {
    const h = b.rev / peak * 100, g = (b.on ? b.tgt : 0) / peak * 100;
    const dd = parseISO(b.ds);
    return `<div class="col">
      <div class="col-stack">
        ${b.on && b.tgt > 0 ? `<div class="col-goal" style="bottom:${g}%"></div>` : ''}
        <div class="col-bar ${b.rev >= b.tgt && b.rev > 0 ? 'hit' : ''}" style="height:${h}%" title="${b.ds}: ${money(b.rev)}"></div>
      </div>
      <div class="col-x">${dd.getDate()}</div>
    </div>`;
  }).join('');

  /* all-time + behaviour correlation */
  const allDays = [...new Set([...Object.keys(S.days), ...Object.keys(S.rev), ...Object.keys(S.logs)])]
    .filter(hasActivity).sort();
  const total = allDays.reduce((a, d) => a + dayRev(d), 0);
  const worked = allDays.length;
  const hits = allDays.filter(d => statusOf(d) === 'hit').length;
  const allDeals = allDays.reduce((a, d) => a + (S.rev[d] || []).filter(r => r.status !== 'booked').length, 0);
  const avgDeal = allDeals ? total / allDeals : 0;

  const withTasks = allDays.filter(d => dayCompletion(d).total > 0);
  const high = withTasks.filter(d => dayCompletion(d).pct >= 0.7);
  const low = withTasks.filter(d => dayCompletion(d).pct < 0.7);
  const avgHigh = high.length ? high.reduce((a, d) => a + dayRev(d), 0) / high.length : 0;
  const avgLow = low.length ? low.reduce((a, d) => a + dayRev(d), 0) / low.length : 0;

  let correlation;
  if (high.length >= 3 && low.length >= 3) {
    const better = avgHigh > avgLow;
    const mult = avgLow > 0 ? (avgHigh / avgLow).toFixed(1) : null;
    correlation = `<div class="insight ${better ? 'good' : 'warn'}">
      <div class="eyebrow">Does the work pay?</div>
      <p>On the <b>${high.length} days</b> you finished 70%+ of the mission you averaged <b>${money(avgHigh)}</b>.
      On the <b>${low.length} days</b> you didn't, you averaged <b>${money(avgLow)}</b>.
      ${better
        ? (mult ? `That's <b>${mult}×</b>. The playbook works — the only variable left is whether you run it.` : 'The playbook works — the only variable left is whether you run it.')
        : `The mission isn't moving revenue yet. Either the tasks are the wrong tasks, or the money is landing on a delay. Check whether your closes trail outreach by a week.`}</p>
    </div>`;
  } else {
    correlation = `<div class="insight">
      <div class="eyebrow">Does the work pay?</div>
      <p>To compare, this needs at least <b>3 strong days</b> (70%+ of the mission done) and <b>3 lighter days</b>. So far you have <b>${high.length}</b> strong and <b>${low.length}</b> lighter. Keep logging honestly — half-done is worth recording as half-done.</p>
    </div>`;
  }

  /* best weekday */
  const byDow = Array.from({ length: 7 }, () => ({ sum: 0, n: 0 }));
  allDays.forEach(d => { const k = parseISO(d).getDay(); byDow[k].sum += dayRev(d); byDow[k].n++; });
  const dowAvg = byDow.map((x, i) => ({ i, avg: x.n ? x.sum / x.n : 0, n: x.n }));
  const dowPeak = Math.max(...dowAvg.map(x => x.avg), 1);

  /* task follow-through */
  const rate = S.tasks.filter(t => t.active !== false).map(t => {
    const days = allDays.filter(d => (t.days || []).includes(parseISO(d).getDay()));
    if (!days.length) return null;
    const done = days.filter(d => taskDone(d, t)).length;
    return { label: t.label, pct: done / days.length, n: days.length };
  }).filter(Boolean).sort((a, b) => a.pct - b.pct).slice(0, 6);

  const paceOff = ms.rev < (S.cfg.monthly_target / ms.last) * dnum;

  return `
  <div class="head">
    <div>
      <div class="head-h">Analytics</div>
      <div class="head-sub">${MON[new Date().getMonth()]} ${new Date().getFullYear()} · ${ms.logged} active day${ms.logged === 1 ? '' : 's'} this month · ${worked} all time</div>
    </div>
    <div class="datenav"><button class="today-btn" data-act="settings">${ICON.gear} Numbers</button></div>
  </div>

  <div class="stats">
    <div class="stat"><div class="eyebrow">Month to date</div><div class="stat-v" style="color:var(--hit)">${money(ms.rev)}</div><div class="stat-note">of ${money(S.cfg.monthly_target)} target</div></div>
    <div class="stat"><div class="eyebrow">Needed per day</div><div class="stat-v" style="color:${paceOff ? 'var(--miss)' : 'var(--hit)'}">${money(perDay)}</div><div class="stat-note">${remaining} day${remaining === 1 ? '' : 's'} left</div></div>
    <div class="stat"><div class="eyebrow">Hit rate · all time</div><div class="stat-v">${worked ? Math.round(hits / worked * 100) : 0}%</div><div class="stat-note">${hits} of ${worked} days</div></div>
    <div class="stat"><div class="eyebrow">Avg deal · all time</div><div class="stat-v">${money(avgDeal)}</div><div class="stat-note">${allDeals} deal${allDeals === 1 ? '' : 's'}</div></div>
  </div>

  <div class="grid2">
    <div class="panel">
      <div class="panel-head"><div class="panel-title">Last 14 days</div><div class="eyebrow">dashes = that day's target</div></div>
      <div class="panel-body tight"><div class="chart">${chart}</div></div>
    </div>

    <div>
      ${correlation}
      <div class="insight ${paceOff ? 'warn' : 'good'}">
        <div class="eyebrow">Monthly pace</div>
        <p>${paceOff
          ? `You're behind. Clearing ${money(S.cfg.monthly_target)} means <b>${money(perDay)} a day</b> for the remaining ${remaining} — about <b>${S.cfg.avg_deal > 0 ? Math.ceil(perDay / S.cfg.avg_deal) : 0} close${Math.ceil(perDay / Math.max(1, S.cfg.avg_deal)) === 1 ? '' : 's'}</b> a day at your average.`
          : `You're on pace. Holding <b>${money(perDay)} a day</b> for the remaining ${remaining} clears ${money(S.cfg.monthly_target)}.`}</p>
      </div>
      ${streak() >= 3 ? `<div class="insight good"><div class="eyebrow">Streak</div><p><b>${streak()} days</b> hitting target in a row. This is the thing you're actually building — don't break it for a slow Tuesday.</p></div>` : ''}
    </div>
  </div>

  <div class="grid2" style="margin-top:16px">
    <div class="panel">
      <div class="panel-head"><div class="panel-title">Weakest follow-through</div><div class="eyebrow">completion rate</div></div>
      <div class="panel-body tight">
        ${rate.length ? `<div class="mini-list">${rate.map(r => `
          <div class="mini-row">
            <span class="k" title="${esc(r.label)}">${esc(r.label)}</span>
            <span class="mini-track"><i style="width:${Math.round(r.pct * 100)}%;background:${r.pct < .5 ? 'var(--miss)' : r.pct < .8 ? 'var(--part)' : 'var(--hit)'}"></i></span>
            <span class="v" style="min-width:38px;text-align:right;color:${r.pct < .5 ? 'var(--miss)' : r.pct < .8 ? 'var(--part)' : 'var(--hit)'}">${Math.round(r.pct * 100)}%</span>
          </div>`).join('')}</div>`
          : '<div class="empty"><b>No data yet</b>Log a few days and the gaps will show up here.</div>'}
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><div class="panel-title">By weekday</div><div class="eyebrow">avg collected</div></div>
      <div class="panel-body tight">
        <div class="mini-list">${dowAvg.map(x => `
          <div class="mini-row">
            <span class="k">${DOW_FULL[x.i]}</span>
            <span class="mini-track"><i style="width:${Math.round(x.avg / dowPeak * 100)}%;background:var(--hit)"></i></span>
            <span class="v" style="min-width:56px;text-align:right;color:${x.avg > 0 ? 'var(--hit)' : 'var(--faint)'}">${money(x.avg)}</span>
          </div>`).join('')}</div>
      </div>
    </div>
  </div>`;
}

/* ═══════════════ RENDER ═══════════════ */
function render() {
  const m = document.getElementById('main');
  m.innerHTML = S.view === 'war' ? viewWar()
    : S.view === 'engine' ? viewEngine()
    : S.view === 'cal' ? viewCal()
    : viewAn();
  document.querySelectorAll('[data-view]').forEach(b => b.classList.toggle('on', b.dataset.view === S.view));
}

function go(view) { S.view = view; window.scrollTo({ top: 0 }); render(); }

/* ═══════════════ MODALS ═══════════════ */
function modalTarget() {
  const d = S.date, cur = dayTarget(d);
  openModal(`
    <div class="modal">
      <h3>Target for ${DOW_FULL[parseISO(d).getDay()]}</h3>
      <div class="sub">${d} · what this day has to produce</div>
      <input class="big-in" id="tv" type="number" inputmode="numeric" value="${cur}">
      <div class="chips">
        ${[200, 300, 400, 500, 750, 1200].map(v => `<button class="chip ${v === cur ? 'on' : ''}" data-preset="${v}">$${v.toLocaleString('en-US')}</button>`).join('')}
      </div>
      <div class="modal-acts">
        <button class="btn ghost" data-close>Cancel</button>
        <button class="btn go" id="tsave">Set target</button>
      </div>
    </div>`);
  const inp = document.getElementById('tv');
  document.querySelectorAll('[data-preset]').forEach(b => b.onclick = () => {
    inp.value = b.dataset.preset;
    document.querySelectorAll('[data-preset]').forEach(x => x.classList.toggle('on', x === b));
  });
  document.getElementById('tsave').onclick = () => {
    setDay(d, { target_amount: Math.max(0, +inp.value || 0) });
    closeModal(); render(); toast('Target set to ' + money(dayTarget(d)));
  };
  inp.onkeydown = e => { if (e.key === 'Enter') document.getElementById('tsave').click(); };
}

function modalRevenue() {
  const d = S.date;
  openModal(`
    <div class="modal">
      <h3>Log revenue</h3>
      <div class="sub">${DOW_FULL[parseISO(d).getDay()]}, ${d}</div>
      <input class="big-in" id="ra" type="number" inputmode="decimal" placeholder="$0" style="margin-bottom:16px">
      <div class="field"><label class="eyebrow" for="rc">Client</label><input class="fld" id="rc" placeholder="Agent, brand, or name"></div>
      <div class="field"><label class="eyebrow" for="rs">Package</label>
        <input class="fld" id="rs" placeholder="Essentials, Sophisticated, Pinnacle…">
        <div class="chips">
          <button class="chip" data-svc="Essentials" data-amt="420">Essentials · $420</button>
          <button class="chip" data-svc="Sophisticated" data-amt="650">Sophisticated · $650</button>
          <button class="chip" data-svc="Pinnacle" data-amt="1300">Pinnacle · $1,300</button>
        </div>
      </div>
      <div class="field"><label class="eyebrow">Status</label>
        <div class="chips">
          <button class="chip on" data-st="collected">Collected</button>
          <button class="chip" data-st="booked">Booked, not paid</button>
        </div>
      </div>
      <div class="modal-acts">
        <button class="btn ghost" data-close>Cancel</button>
        <button class="btn go" id="rsave">Add revenue</button>
      </div>
    </div>`);
  let status = 'collected';
  document.querySelectorAll('[data-st]').forEach(b => b.onclick = () => {
    status = b.dataset.st;
    document.querySelectorAll('[data-st]').forEach(x => x.classList.toggle('on', x === b));
  });
  /* package chips always set the matching price (fixes the amount staying at the first package's price) */
  document.querySelectorAll('[data-svc]').forEach(b => b.onclick = () => {
    document.getElementById('rs').value = b.dataset.svc;
    document.getElementById('ra').value = b.dataset.amt;
    document.querySelectorAll('[data-svc]').forEach(x => x.classList.toggle('on', x === b));
  });
  document.getElementById('rsave').onclick = () => {
    const amt = +document.getElementById('ra').value;
    if (!amt) { toast('Enter an amount first'); return; }
    const row = {
      id: uid(), day: d, amount: amt,
      client: document.getElementById('rc').value.trim(),
      service: document.getElementById('rs').value.trim(),
      status, note: '', created_at: new Date().toISOString()
    };
    (S.rev[d] ||= []).push(row);
    saveCache();
    upsert('ros_revenue', [row], 'id');
    if (!targetIsSet(d)) setDay(d, { target_amount: dayTarget(d) });
    closeModal();
    const cleared = status !== 'booked' && dayRev(d) >= dayTarget(d) && dayTarget(d) > 0;
    render();
    toast(cleared ? `Target cleared — ${money(dayRev(d))} today` : money(amt) + ' logged', cleared);
  };
  document.getElementById('ra').onkeydown = e => { if (e.key === 'Enter') document.getElementById('rsave').click(); };
}

function modalQty(t) {
  const d = S.date, l = logOf(d, t.id), tg = tgtOf(d, t);
  openModal(`
    <div class="modal">
      <h3>${esc(t.label)}</h3>
      <div class="sub">${DOW_FULL[parseISO(d).getDay()]}, ${d}</div>
      <div class="field"><label class="eyebrow" for="qd">How many did you actually do?</label>
        <input class="big-in" id="qd" type="number" inputmode="numeric" value="${l.qty_done || 0}">
      </div>
      <div class="field"><label class="eyebrow" for="qt">Target for this day only</label>
        <input class="big-in" id="qt" type="number" inputmode="numeric" value="${tg}" style="font-size:24px;height:56px">
        <div class="chips">
          <span class="chip" style="pointer-events:none;border-style:dashed;display:inline-flex;align-items:center">Playbook default: ${t.target_qty || 0}</span>
          <button class="chip" id="qreset">Reset to default</button>
        </div>
      </div>
      <div class="modal-acts">
        <button class="btn ghost" data-close>Cancel</button>
        <button class="btn go" id="qsave">Save</button>
      </div>
    </div>`);
  document.getElementById('qreset').onclick = () => { document.getElementById('qt').value = t.target_qty || 0; };
  document.getElementById('qsave').onclick = () => {
    const qd = Math.max(0, +document.getElementById('qd').value || 0);
    const qt = Math.max(0, +document.getElementById('qt').value || 0);
    setLog(d, t.id, { qty_done: qd, target_override: qt === (t.target_qty || 0) ? null : qt, done: qt > 0 ? qd >= qt : true });
    closeModal(); render();
  };
}

function modalSettings() {
  openModal(`
    <div class="modal">
      <h3>Your numbers</h3>
      <div class="sub">Everything else is calculated from these.</div>
      <div class="field"><label class="eyebrow" for="s1">Monthly revenue target</label><input class="fld" id="s1" type="number" value="${S.cfg.monthly_target}"></div>
      <div class="field"><label class="eyebrow" for="s2">Default daily target</label><input class="fld" id="s2" type="number" value="${S.cfg.default_daily}"></div>
      <div class="field"><label class="eyebrow" for="s3">Average deal size</label><input class="fld" id="s3" type="number" value="${S.cfg.avg_deal}"></div>
      <div class="field"><label class="eyebrow" for="s4">Close rate (%)</label><input class="fld" id="s4" type="number" value="${S.cfg.close_rate}"></div>
      <div class="modal-acts">
        <button class="btn ghost" data-close>Cancel</button>
        <button class="btn go" id="ssave">Save</button>
      </div>
    </div>`);
  document.getElementById('ssave').onclick = () => {
    S.cfg = {
      monthly_target: +document.getElementById('s1').value || 0,
      default_daily: +document.getElementById('s2').value || 0,
      avg_deal: +document.getElementById('s3').value || 0,
      close_rate: +document.getElementById('s4').value || 0
    };
    saveCfg(); closeModal(); render(); toast('Numbers saved');
  };
}

/* ═══════════════ EVENTS ═══════════════ */
document.addEventListener('click', e => {
  const nav = e.target.closest('[data-view]');
  if (nav) { go(nav.dataset.view); return; }
  if (e.target.closest('[data-close]')) { closeModal(); return; }

  const el = e.target.closest('[data-act]');
  if (!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  const d = S.date;
  const task = id ? S.tasks.find(t => t.id === id) : null;

  switch (a) {
    case 'nav-day': S.date = addDays(d, +el.dataset.delta); render(); break;
    case 'today': S.date = TODAY(); render(); break;
    case 'set-target': modalTarget(); break;
    case 'add-rev': modalRevenue(); break;
    case 'settings': modalSettings(); break;

    case 'del-rev':
      if (!confirm('Delete this revenue entry?')) return;
      S.rev[d] = (S.rev[d] || []).filter(r => r.id !== id);
      saveCache(); remove('ros_revenue', 'id=eq.' + id); render();
      break;

    case 'toggle':
      setLog(d, id, { done: !logOf(d, id).done }); render();
      break;

    case 'qty': {
      const tg = tgtOf(d, task);
      const next = Math.max(0, (logOf(d, id).qty_done || 0) + (+el.dataset.delta));
      setLog(d, id, { qty_done: next, done: next >= tg });
      render();
      break;
    }
    case 'qty-max': {
      const tg = tgtOf(d, task), cur = logOf(d, id).qty_done || 0;
      const next = cur >= tg ? 0 : tg;
      setLog(d, id, { qty_done: next, done: next >= tg });
      render();
      break;
    }
    case 'qty-edit': modalQty(task); break;

    /* ── calendar ── */
    case 'cal-prev': case 'cal-next': {
      const [y, m] = S.calMonth.split('-').map(Number);
      const nd = new Date(y, m - 1 + (a === 'cal-next' ? 1 : -1), 1);
      S.calMonth = iso(nd);
      loadMonthLogs(S.calMonth);
      render();
      break;
    }
    case 'cal-day': S.date = el.dataset.date; go('war'); break;

    /* ── engine editor ── */
    case 'eng-add': {
      const key = 'eng_' + Date.now().toString(36);
      const e2 = { id: key, name: 'New engine', window_label: '', color: '#F26B1D', sort: S.engines.length + 1, active: true };
      S.engines.push(e2); saveEngine(e2); render();
      break;
    }
    case 'eng-del': {
      const eng = S.engines.find(x => x.id === id);
      if (!confirm(`Delete "${eng?.name}" and its ${S.tasks.filter(t => t.engine_id === id).length} task(s)? Past logs stay in the calendar.`)) return;
      S.engines = S.engines.filter(x => x.id !== id);
      S.tasks = S.tasks.filter(t => t.engine_id !== id);
      saveCache(); remove('ros_engine', 'id=eq.' + id); render();
      break;
    }
    case 'eng-up': case 'eng-down': reorder(S.engines, id, a === 'eng-up' ? -1 : 1, saveEngine); render(); break;

    case 'task-add': {
      const eng = el.dataset.eng;
      const t2 = { id: uid(), engine_id: eng, label: '', target_qty: 0, unit: '', days: [1, 2, 3, 4, 5], sort: S.tasks.filter(x => x.engine_id === eng).length + 1, active: true };
      S.tasks.push(t2); saveTask(t2); render();
      const inp = document.querySelector(`[data-fld="t-label"][data-id="${t2.id}"]`);
      inp?.focus();
      break;
    }
    case 't-del':
      if (!confirm('Delete this task? Past logs stay in the calendar.')) return;
      S.tasks = S.tasks.filter(t => t.id !== id);
      saveCache(); remove('ros_task', 'id=eq.' + id); render();
      break;
    case 't-active': task.active = task.active === false; saveTask(task); render(); break;
    case 't-up': case 't-down': {
      const sibs = S.tasks.filter(t => t.engine_id === task.engine_id).sort((x, y) => (x.sort || 0) - (y.sort || 0));
      reorder(sibs, id, a === 't-up' ? -1 : 1, saveTask); render();
      break;
    }
    case 'daybit': {
      const dayN = +el.dataset.day;
      const set = new Set(task.days || []);
      set.has(dayN) ? set.delete(dayN) : set.add(dayN);
      task.days = [...set].sort();
      saveTask(task); render();
      break;
    }
  }
});

function reorder(arr, id, dir, saver) {
  const i = arr.findIndex(x => x.id === id), j = i + dir;
  if (i < 0 || j < 0 || j >= arr.length) return;
  [arr[i].sort, arr[j].sort] = [arr[j].sort || j + 1, arr[i].sort || i + 1];
  saver(arr[i]); saver(arr[j]);
}

/* field edits */
document.addEventListener('input', e => {
  const f = e.target.dataset.fld;
  if (!f) return;
  const id = e.target.dataset.id, v = e.target.value;
  const task = () => S.tasks.find(t => t.id === id);
  const eng = () => S.engines.find(x => x.id === id);
  clearTimeout(e.target._t);
  const later = fn => { e.target._t = setTimeout(fn, 550); };

  switch (f) {
    case 'date': if (v) { S.date = v; render(); } break;
    case 'note': later(() => setDay(S.date, { note: v })); break;
    case 't-label': task().label = v; later(() => saveTask(task())); break;
    case 't-qty': task().target_qty = Math.max(0, +v || 0); later(() => saveTask(task())); break;
    case 't-unit': task().unit = v; later(() => saveTask(task())); break;
    case 'eng-name': eng().name = v; later(() => saveEngine(eng())); break;
    case 'eng-win': eng().window_label = v; later(() => saveEngine(eng())); break;
    case 'eng-color': eng().color = v; later(() => saveEngine(eng())); break;
  }
});

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
window.addEventListener('online', flush);

/* lazily pull logs for months outside the initial 180-day window */
async function loadMonthLogs(ym) {
  const key = ym.slice(0, 7);
  if (S.loadedMonths.has(key)) return;
  S.loadedMonths.add(key);
  const [y, m] = key.split('-').map(Number);
  const from = `${y}-${String(m).padStart(2, '0')}-01`;
  const to = iso(new Date(y, m, 0));
  try {
    const rows = await api(`ros_log?select=*&day=gte.${from}&day=lte.${to}&limit=20000`);
    rows.forEach(l => ((S.logs[l.day] ||= {})[l.task_id] = l));
    saveCache(); render();
  } catch (err) { /* offline — cache covers it */ }
}

boot();

</script>
